name: Phase 3C prospective forecast attestation

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Repository-relative prospective origin spec (ignored for synthetic validation)
        required: false
        type: string
      synthetic_fixture:
        description: Attest a clearly synthetic workflow fixture
        required: true
        default: true
        type: boolean
      synthetic_publication_rehearsal:
        description: Run the read-only synthetic publication-attestation rehearsal
        required: true
        default: false
        type: boolean
      rehearsal_ref:
        description: Exact commit containing the rehearsal implementation
        required: false
        type: string

permissions: {}

jobs:
  attest-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused verification dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas

      - name: Require signer-policy-safe GitHub CLI
        run: |
          set -euo pipefail
          GH_VERSION="$(gh --version | awk 'NR == 1 {print $3}')"
          python - "$GH_VERSION" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split(".")[:3])
          if version < (2, 97, 0):
              raise SystemExit("gh >= 2.97.0 is required for signer-workflow policy enforcement")
          PY

      - name: Select and validate attestation subject
        id: subject
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          SYNTHETIC_FIXTURE: ${{ inputs.synthetic_fixture }}
        run: |
          set -euo pipefail
          if [[ "$SYNTHETIC_FIXTURE" == "true" ]]; then
            mkdir -p synthetic-phase3c-attestation-fixture
            printf '%s\n' '{"evidence_class":"synthetic","purpose":"workflow_structure_validation_only","prospective_nfl_evidence":false}' > synthetic-phase3c-attestation-fixture/manifest.json
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf synthetic-phase3c-attestation-fixture.tar.gz synthetic-phase3c-attestation-fixture
            printf '%s\n' 'subject_path=synthetic-phase3c-attestation-fixture.tar.gz' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'evidence_class=synthetic' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'bundle_directory=synthetic-phase3c-attestation-fixture' >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            test -n "$SPEC_PATH"
            test -f "$SPEC_PATH"
            export SPEC_PATH
            python -c 'import json,os; spec=json.load(open(os.environ["SPEC_PATH"])); spec["code_commit"]=os.environ["GITHUB_SHA"]; open("phase3c-origin-spec.json","w").write(json.dumps(spec,sort_keys=True,separators=(",",":"))+"\n")'
            BUNDLE_PATH="phase3c-prospective-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            python -m ball_knower_v3.modeling.prospective_pipeline build --spec phase3c-origin-spec.json --output-dir "$BUNDLE_PATH"
            python -m ball_knower_v3.modeling.prospective_pipeline verify --bundle "$BUNDLE_PATH" --allow-local-unattested
            test -f "${BUNDLE_PATH}.tar.gz"
            printf '%s\n' "subject_path=${BUNDLE_PATH}.tar.gz" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'evidence_class=prospective_ingested' >> "$GITHUB_OUTPUT"
            printf '%s\n' "bundle_directory=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve built-unattested bundle
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-built-unattested-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.subject.outputs.subject_path }}
            ${{ steps.subject.outputs.bundle_directory }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub artifact attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.subject.outputs.subject_path }}

      - name: Verify signed timestamps, signer workflow, source revision, and subject
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_PATH: ${{ steps.subject.outputs.subject_path }}
          EVIDENCE_CLASS: ${{ steps.subject.outputs.evidence_class }}
          BUNDLE_DIRECTORY: ${{ steps.subject.outputs.bundle_directory }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SIGSTORE_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          SIGNER_WORKFLOW="$GITHUB_REPOSITORY/.github/workflows/phase3c-prospective-attestation.yml"
          gh attestation verify "$SUBJECT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format=json > verified-attestation.json
          if [[ "$EVIDENCE_CLASS" == "prospective_ingested" ]]; then
            python -m ball_knower_v3.modeling.prospective_pipeline receipt \
              --bundle "$BUNDLE_DIRECTORY" \
              --archive "$SUBJECT_PATH" \
              --verification-json verified-attestation.json \
              --output phase3c-attestation-receipt.json \
              --repository "$GITHUB_REPOSITORY" \
              --attestation-id "$ATTESTATION_ID" \
              --attestation-url "$ATTESTATION_URL" \
              --sigstore-bundle-path "$SIGSTORE_BUNDLE_PATH"
          else
            printf '%s\n' '{"forecast_evidence_class":"synthetic","prospective_nfl_evidence":false,"prospective_transaction_state":"synthetic_only"}' > phase3c-attestation-receipt.json
          fi

      - name: Preserve attested-unregistered evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-attested-unregistered-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.subject.outputs.subject_path }}
            ${{ steps.subject.outputs.bundle_directory }}
            ${{ steps.attest.outputs.bundle-path }}
            verified-attestation.json
            phase3c-attestation-receipt.json
          if-no-files-found: error
          retention-days: 90

  synthetic-publication-rehearsal:
    if: ${{ inputs.synthetic_fixture == true && inputs.synthetic_publication_rehearsal == true }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Require main signer context and exact rehearsal commit
        env:
          REHEARSAL_REF: ${{ inputs.rehearsal_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$REHEARSAL_REF"
          test "$REHEARSAL_REF" != "$GITHUB_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rehearsal_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused rehearsal dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas pytest

      - name: Construct synthetic-only temporary inputs
        id: fixture
        env:
          REHEARSAL_REF: ${{ inputs.rehearsal_ref }}
          REAL_GH: /usr/bin/gh
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REHEARSAL_REF"
          ROOT="$RUNNER_TEMP/synthetic-publication-rehearsal-root"
          mkdir -p "$ROOT"
          export ROOT
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from ball_knower_v3.modeling.prospective_pipeline import (
              _deterministic_archive,
              create_attestation_receipt,
          )
          from ball_knower_v3.modeling.state_fitting import canonical_json, digest
          from tests.ball_knower_v3.test_prospective_pipeline import (
              _fixture_bundle,
              _verification_payload,
          )

          root = Path(os.environ["ROOT"])
          repository = os.environ["GITHUB_REPOSITORY"]
          source_commit = os.environ["GITHUB_SHA"]
          bundle = _fixture_bundle(
              root,
              "synthetic-non-nfl-forecast-fixture",
              origin="2026-09-15T16:00:00+00:00",
              kickoff="2026-12-04T01:15:00+00:00",
              season=2099,
              competition_week=99,
              code_commit=source_commit,
          )
          manifest_path = bundle[0] / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["content"].update({
              "evidence_class": "synthetic",
              "prospective_nfl_evidence": False,
              "synthetic_fixture_id": "phase3c-publication-attestation-rehearsal-v1",
              "synthetic_rehearsal": True,
          })
          manifest["content_sha256"] = digest(manifest["content"])
          manifest_path.write_text(canonical_json(manifest) + "\n")
          _deterministic_archive(bundle[0], bundle[4])

          forecast_verification = _verification_payload(
              bundle[4],
              timestamp="2026-09-15T16:30:00+00:00",
              repository=repository,
              commit=source_commit,
          )
          forecast_verification_path = root / "synthetic-forecast-verification.json"
          forecast_verification_path.write_text(canonical_json(forecast_verification) + "\n")
          forecast_receipt = root / "synthetic-forecast-receipt.json"
          create_attestation_receipt(
              bundle[0], bundle[4], forecast_verification_path, forecast_receipt,
              repository=repository,
              attestation_id="synthetic-forecast-setup-already-host-validated",
              attestation_url="https://github.com/EMERKOR/BK_v2/actions",
              sigstore_bundle_path="synthetic-forecast-setup.json",
          )

          registry_dir = root / "temporary-synthetic-registry"
          registry_dir.mkdir()
          registry = registry_dir / "synthetic_phase3c_registry.jsonl"
          genesis = {
              "schema_version": "phase3c_prospective_registry_v1",
              "record_type": "synthetic_rehearsal_genesis",
              "evidence_class": "synthetic",
              "prospective_nfl_evidence": False,
              "synthetic_fixture_id": "phase3c-publication-attestation-rehearsal-v1",
              "previous_record_sha256": None,
          }
          genesis["record_sha256"] = digest(genesis)
          registry.write_text(canonical_json(genesis) + "\n")
          registry_sha = hashlib.sha256(registry.read_bytes()).hexdigest()
          anchor = registry_dir / "synthetic_phase3c_registry_anchor.json"
          anchor.write_text(canonical_json({
              "schema_version": "phase3c_prospective_registry_anchor_v1",
              "registry_path": str(registry),
              "previous_registry_commit": None,
              "previous_registry_head_digest": None,
              "registry_head_digest": genesis["record_sha256"],
              "registry_file_sha256": registry_sha,
              "last_bundle_digest": None,
              "evidence_class": "synthetic",
              "prospective_nfl_evidence": False,
          }) + "\n")

          tools = root / "synthetic-tools"
          tools.mkdir()
          gh_wrapper = tools / "gh"
          gh_wrapper.write_text(
              "#!/usr/bin/env python3\n"
              "import json,os,sys\n"
              f"payload={json.dumps(forecast_verification)!r}\n"
              f"forecast={str(bundle[4])!r}\n"
              "if len(sys.argv)>3 and sys.argv[1:3]==['attestation','verify'] and sys.argv[3]==forecast:\n"
              " required=['--repo',os.environ['GITHUB_REPOSITORY'],'--source-digest',os.environ['GITHUB_SHA'],'--source-ref','refs/heads/main','--deny-self-hosted-runners','--format=json']\n"
              " assert all(value in sys.argv for value in required)\n"
              " print(payload); raise SystemExit(0)\n"
              "real=os.environ['REAL_GH']; os.execv(real,[real,*sys.argv[1:]])\n"
          )
          gh_wrapper.chmod(0o755)
          git_wrapper = tools / "git"
          git_wrapper.write_text(
              "#!/usr/bin/env python3\n"
              "import os,sys\n"
              "commit=os.environ['GITHUB_SHA']\n"
              "if sys.argv[1]=='rev-parse': print(commit); raise SystemExit(0)\n"
              "if sys.argv[1:3]==['merge-base','--is-ancestor'] and sys.argv[3:]==[commit,commit]: raise SystemExit(0)\n"
              "raise SystemExit(2)\n"
          )
          git_wrapper.chmod(0o755)

          values = {
              "root": root,
              "bundle": bundle[0],
              "forecast_receipt": forecast_receipt,
              "registry": registry,
              "anchor": anchor,
              "gh_wrapper": gh_wrapper,
              "git_wrapper": git_wrapper,
              "registry_sha256": registry_sha,
              "anchor_sha256": hashlib.sha256(anchor.read_bytes()).hexdigest(),
          }
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          PY
          shasum -a 256 \
            ball_knower_v3/prospective/phase3c_registry.jsonl \
            ball_knower_v3/prospective/phase3c_registry_anchor.json > "$ROOT/real-registry-before.sha256"

      - name: Prepare deterministic synthetic publication transaction
        id: publication
        env:
          REAL_GH: /usr/bin/gh
        run: |
          set -euo pipefail
          TRANSACTION="${{ steps.fixture.outputs.root }}/synthetic-registry-publication-transaction"
          python -m ball_knower_v3.modeling.prospective_pipeline prepare-publication \
            --bundle "${{ steps.fixture.outputs.bundle }}" \
            --attestation-receipt "${{ steps.fixture.outputs.forecast_receipt }}" \
            --registry "${{ steps.fixture.outputs.registry }}" \
            --anchor "${{ steps.fixture.outputs.anchor }}" \
            --output-dir "$TRANSACTION" \
            --repository "$GITHUB_REPOSITORY" \
            --registry-base-commit "$GITHUB_SHA" \
            --gh-executable "${{ steps.fixture.outputs.gh_wrapper }}" \
            --git-executable "${{ steps.fixture.outputs.git_wrapper }}" > "${{ steps.fixture.outputs.root }}/publication-preparation.json"
          EVIDENCE_PATH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["publication_evidence_path"])' "${{ steps.fixture.outputs.root }}/publication-preparation.json")"
          python - "$TRANSACTION" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ball_knower_v3.modeling.prospective_pipeline import _deterministic_archive
          transaction = Path(sys.argv[1])
          original = transaction.with_suffix(".tar.gz")
          with TemporaryDirectory() as temporary:
              rebuilt = Path(temporary) / "rebuilt.tar.gz"
              _deterministic_archive(transaction, rebuilt)
              assert hashlib.sha256(original.read_bytes()).digest() == hashlib.sha256(rebuilt.read_bytes()).digest()
          PY
          printf '%s\n' "transaction=$TRANSACTION" >> "$GITHUB_OUTPUT"
          printf '%s\n' "archive=${TRANSACTION}.tar.gz" >> "$GITHUB_OUTPUT"
          printf '%s\n' "evidence_path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"

      - name: Attest synthetic publication transaction
        id: attest-publication-rehearsal
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.publication.outputs.archive }}

      - name: Verify hosted publication attestation and construct synthetic receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REAL_GH: /usr/bin/gh
          ATTESTATION_ID: ${{ steps.attest-publication-rehearsal.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-publication-rehearsal.outputs.attestation-url }}
          SIGSTORE_BUNDLE_PATH: ${{ steps.attest-publication-rehearsal.outputs.bundle-path }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.fixture.outputs.root }}"
          ARCHIVE="${{ steps.publication.outputs.archive }}"
          SIGNER_WORKFLOW="$GITHUB_REPOSITORY/.github/workflows/phase3c-prospective-attestation.yml"
          gh attestation verify "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format=json > "$ROOT/publication-verified-attestation.json"
          python -m ball_knower_v3.modeling.prospective_pipeline publication-receipt \
            --publication-transaction "${{ steps.publication.outputs.transaction }}" \
            --archive "$ARCHIVE" \
            --verification-json "$ROOT/publication-verified-attestation.json" \
            --output "${{ steps.publication.outputs.evidence_path }}" \
            --repository "$GITHUB_REPOSITORY" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL" \
            --sigstore-bundle-path "$SIGSTORE_BUNDLE_PATH" \
            --synthetic-rehearsal > "$ROOT/publication-receipt-result.json"
          python -m ball_knower_v3.modeling.prospective_pipeline verify-publication \
            --bundle "${{ steps.fixture.outputs.bundle }}" \
            --attestation-receipt "${{ steps.fixture.outputs.forecast_receipt }}" \
            --publication-transaction "${{ steps.publication.outputs.transaction }}" \
            --publication-attestation-receipt "${{ steps.publication.outputs.evidence_path }}" \
            --registry "${{ steps.fixture.outputs.registry }}" \
            --anchor "${{ steps.fixture.outputs.anchor }}" \
            --repository "$GITHUB_REPOSITORY" \
            --registry-base-commit "$GITHUB_SHA" \
            --gh-executable "${{ steps.fixture.outputs.gh_wrapper }}" \
            --git-executable "${{ steps.fixture.outputs.git_wrapper }}" \
            --synthetic-rehearsal > "$ROOT/exact-transaction-verification.json"

      - name: Prove rehearsal remained synthetic and read-only
        run: |
          set -euo pipefail
          ROOT="${{ steps.fixture.outputs.root }}"
          test "$(shasum -a 256 "${{ steps.fixture.outputs.registry }}" | awk '{print $1}')" = "${{ steps.fixture.outputs.registry_sha256 }}"
          test "$(shasum -a 256 "${{ steps.fixture.outputs.anchor }}" | awk '{print $1}')" = "${{ steps.fixture.outputs.anchor_sha256 }}"
          shasum -a 256 -c "$ROOT/real-registry-before.sha256"
          git diff --exit-code -- \
            ball_knower_v3/prospective/phase3c_registry.jsonl \
            ball_knower_v3/prospective/phase3c_registry_anchor.json
          export ROOT ATTESTATION_ID
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          verified = json.loads((root / "publication-verified-attestation.json").read_text())
          receipt = json.loads(Path(os.environ["PUBLICATION_RECEIPT"]).read_text())
          exact = json.loads((root / "exact-transaction-verification.json").read_text())
          result = verified[0]["verificationResult"]
          certificate = result["signature"]["certificate"]
          timestamps = result["verifiedTimestamps"]
          subject = result["statement"]["subject"][0]["digest"]["sha256"]
          expected_signer = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/.github/workflows/phase3c-prospective-attestation.yml@refs/heads/main"
          assert timestamps
          assert certificate["sourceRepositoryRef"] == "refs/heads/main"
          assert certificate["buildSignerURI"] == expected_signer
          assert receipt["evidence_class"] == "synthetic"
          assert receipt["prospective_nfl_evidence"] is False
          assert receipt["prospective_transaction_state"] == "synthetic_publication_attested_only"
          assert exact["exact_transaction_verified"] is True
          assert exact["registry_write_performed"] is False
          assert exact["prospective_nfl_evidence"] is False
          summary = {
              "attestation_id": os.environ["ATTESTATION_ID"],
              "signed_timestamp": timestamps[0]["timestamp"],
              "signer_uri": certificate["buildSignerURI"],
              "source_ref": certificate["sourceRepositoryRef"],
              "subject_sha256": subject,
              "publication_receipt_constructed": True,
              "exact_transaction_verified": True,
              "registry_write_performed": False,
              "evidence_class": "synthetic",
              "prospective_nfl_evidence": False,
          }
          (root / "hosted-rehearsal-summary.json").write_text(json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n")
          PY
        env:
          ATTESTATION_ID: ${{ steps.attest-publication-rehearsal.outputs.attestation-id }}
          PUBLICATION_RECEIPT: ${{ steps.publication.outputs.evidence_path }}

      - name: Preserve synthetic publication-attestation rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-synthetic-publication-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.fixture.outputs.root }}/hosted-rehearsal-summary.json
            ${{ steps.fixture.outputs.root }}/publication-preparation.json
            ${{ steps.fixture.outputs.root }}/publication-verified-attestation.json
            ${{ steps.fixture.outputs.root }}/publication-receipt-result.json
            ${{ steps.fixture.outputs.root }}/exact-transaction-verification.json
            ${{ steps.publication.outputs.transaction }}
            ${{ steps.publication.outputs.archive }}
            ${{ steps.publication.outputs.evidence_path }}
            ${{ steps.attest-publication-rehearsal.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

  publish-registry:
    if: ${{ inputs.synthetic_fixture == false }}
    needs: attest-and-verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused verification dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas

      - name: Require signer-policy-safe GitHub CLI
        run: |
          set -euo pipefail
          GH_VERSION="$(gh --version | awk 'NR == 1 {print $3}')"
          python - "$GH_VERSION" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split(".")[:3])
          if version < (2, 97, 0):
              raise SystemExit("gh >= 2.97.0 is required for signer-workflow policy enforcement")
          PY

      - name: Download exact attested-unregistered transaction
        uses: actions/download-artifact@v4
        with:
          name: phase3c-attested-unregistered-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-transaction

      - name: Verify forecast and seal exact registry publication proposal
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REGISTRY="ball_knower_v3/prospective/phase3c_registry.jsonl"
          ANCHOR="ball_knower_v3/prospective/phase3c_registry_anchor.json"
          BASE_COMMIT="$(git rev-parse HEAD)"
          BUNDLE="$(find verified-transaction -mindepth 1 -maxdepth 1 -type d -name 'phase3c-prospective-*' -print -quit)"
          test -n "$BUNDLE"
          python -m ball_knower_v3.modeling.prospective_pipeline prepare-publication \
            --bundle "$BUNDLE" \
            --attestation-receipt verified-transaction/phase3c-attestation-receipt.json \
            --registry "$REGISTRY" \
            --anchor "$ANCHOR" \
            --output-dir registry-publication-transaction \
            --repository "$GITHUB_REPOSITORY" \
            --registry-base-commit "$BASE_COMMIT" > registry-publication-preparation.json
          EVIDENCE_PATH="$(python -c 'import json; d=json.load(open("registry-publication-preparation.json")); print(d.get("publication_evidence_path",d.get("registry_publication_attestation_path","")))')"
          IDEMPOTENT="$(python -c 'import json; print(str(json.load(open("registry-publication-preparation.json"))["idempotent_existing"]).lower())')"
          printf '%s\n' "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "base_commit=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
          printf '%s\n' "evidence_path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"
          printf '%s\n' "idempotent_existing=$IDEMPOTENT" >> "$GITHUB_OUTPUT"

      - name: Attest exact registry publication proposal
        if: ${{ steps.publication.outputs.idempotent_existing != 'true' }}
        id: attest-publication
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: registry-publication-transaction.tar.gz

      - name: Verify and persist pre-kickoff registry publication witness
        if: ${{ steps.publication.outputs.idempotent_existing != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest-publication.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-publication.outputs.attestation-url }}
          SIGSTORE_BUNDLE_PATH: ${{ steps.attest-publication.outputs.bundle-path }}
          EVIDENCE_PATH: ${{ steps.publication.outputs.evidence_path }}
        run: |
          set -euo pipefail
          SIGNER_WORKFLOW="$GITHUB_REPOSITORY/.github/workflows/phase3c-prospective-attestation.yml"
          gh attestation verify registry-publication-transaction.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format=json > registry-publication-verified-attestation.json
          python -m ball_knower_v3.modeling.prospective_pipeline publication-receipt \
            --publication-transaction registry-publication-transaction \
            --archive registry-publication-transaction.tar.gz \
            --verification-json registry-publication-verified-attestation.json \
            --output "$EVIDENCE_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL" \
            --sigstore-bundle-path "$SIGSTORE_BUNDLE_PATH"

      - name: Admit and publish only the exact attested transaction
        if: ${{ steps.publication.outputs.idempotent_existing != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ball_knower_v3/prospective/phase3c_registry.jsonl
          ANCHOR: ball_knower_v3/prospective/phase3c_registry_anchor.json
          BUNDLE: ${{ steps.publication.outputs.bundle }}
          BASE_COMMIT: ${{ steps.publication.outputs.base_commit }}
          EVIDENCE_PATH: ${{ steps.publication.outputs.evidence_path }}
        run: |
          set -euo pipefail
          python -m ball_knower_v3.modeling.prospective_pipeline register \
            --bundle "$BUNDLE" \
            --attestation-receipt verified-transaction/phase3c-attestation-receipt.json \
            --publication-transaction registry-publication-transaction \
            --publication-attestation-receipt "$EVIDENCE_PATH" \
            --registry "$REGISTRY" \
            --anchor "$ANCHOR" \
            --repository "$GITHUB_REPOSITORY" \
            --registry-base-commit "$BASE_COMMIT" > registry-publication-result.json
          if ! git diff --quiet -- "$REGISTRY" "$ANCHOR"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- "$REGISTRY" "$ANCHOR" "$EVIDENCE_PATH"
            test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s\n%s\n' "$REGISTRY" "$ANCHOR" "$EVIDENCE_PATH" | sort)"
            git commit -m "Register Phase 3C prospective forecast"
            git push origin HEAD:main
          fi
          PUBLICATION_COMMIT="$(git log -1 --format=%H -- "$REGISTRY")"
          export BASE_COMMIT PUBLICATION_COMMIT REGISTRY ANCHOR
          python - <<'PY'
          import json, os
          with open("registry-publication-result.json") as stream:
              result = json.load(stream)
          with open(os.environ["ANCHOR"]) as stream:
              anchor = json.load(stream)
          publication = {
              "prospective_transaction_state": "registered_prospective",
              "bundle_digest": result["bundle_digest"],
              "registry_path": os.environ["REGISTRY"],
              "registry_base_commit": os.environ["BASE_COMMIT"],
              "registry_publication_commit": os.environ["PUBLICATION_COMMIT"],
              "previous_registry_head_digest": result["previous_registry_head_digest"],
              "new_registry_head_digest": result["record_sha256"],
              "registry_file_sha256": anchor["registry_file_sha256"],
              "registry_publication_attestation_path": os.environ["EVIDENCE_PATH"],
              "idempotent_existing": result["idempotent_existing"],
          }
          with open("registry-publication-anchor.json", "w") as stream:
              json.dump(publication, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY

      - name: Preserve externally anchored publication result
        if: ${{ steps.publication.outputs.idempotent_existing != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-registered-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            registry-publication-result.json
            registry-publication-anchor.json
            registry-publication-preparation.json
            registry-publication-transaction
            registry-publication-transaction.tar.gz
            registry-publication-verified-attestation.json
            ${{ steps.attest-publication.outputs.bundle-path }}
            ${{ steps.publication.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Preserve idempotent existing registration result
        if: ${{ steps.publication.outputs.idempotent_existing == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-registered-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: registry-publication-preparation.json
          if-no-files-found: error
          retention-days: 90

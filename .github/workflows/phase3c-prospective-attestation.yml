name: Phase 3C prospective forecast attestation

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Repository-relative prospective origin spec (ignored for synthetic validation)
        required: false
        type: string
      synthetic_fixture:
        description: Attest a clearly synthetic workflow fixture
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused verification dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas

      - name: Select and validate attestation subject
        id: subject
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          SYNTHETIC_FIXTURE: ${{ inputs.synthetic_fixture }}
        run: |
          set -euo pipefail
          if [[ "$SYNTHETIC_FIXTURE" == "true" ]]; then
            mkdir -p synthetic-phase3c-attestation-fixture
            printf '%s\n' '{"evidence_class":"synthetic","purpose":"workflow_structure_validation_only","prospective_nfl_evidence":false}' > synthetic-phase3c-attestation-fixture/manifest.json
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf synthetic-phase3c-attestation-fixture.tar.gz synthetic-phase3c-attestation-fixture
            printf '%s\n' 'subject_path=synthetic-phase3c-attestation-fixture.tar.gz' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'bundle_digest=synthetic_fixture_not_a_prospective_bundle' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'evidence_class=synthetic' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'bundle_directory=synthetic-phase3c-attestation-fixture' >> "$GITHUB_OUTPUT"
          else
            test -n "$SPEC_PATH"
            test -f "$SPEC_PATH"
            export SPEC_PATH
            python - <<'PY'
            import json, os
            with open(os.environ["SPEC_PATH"]) as stream:
                spec = json.load(stream)
            spec["code_commit"] = os.environ["GITHUB_SHA"]
            with open("phase3c-origin-spec.json", "w") as stream:
                json.dump(spec, stream, sort_keys=True, separators=(",", ":"))
                stream.write("\n")
            PY
            BUNDLE_PATH="phase3c-prospective-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            python -m ball_knower_v3.modeling.prospective_pipeline build --spec phase3c-origin-spec.json --output-dir "$BUNDLE_PATH"
            python -m ball_knower_v3.modeling.prospective_pipeline verify --bundle "$BUNDLE_PATH" --allow-local-unattested
            python -c 'import pandas as pd,sys; frame=pd.read_csv(sys.argv[1]); now=pd.Timestamp.now(tz="UTC"); assert (pd.to_datetime(frame.kickoff,utc=True)>now).all(), "attestation must complete before every target kickoff"' "$BUNDLE_PATH/structural/structural_state_forecasts.csv"
            test -f "${BUNDLE_PATH}.tar.gz"
            BUNDLE_DIGEST="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_sha256"])' "$BUNDLE_PATH/manifest.json")"
            printf '%s\n' "subject_path=${BUNDLE_PATH}.tar.gz" >> "$GITHUB_OUTPUT"
            printf '%s\n' "bundle_digest=$BUNDLE_DIGEST" >> "$GITHUB_OUTPUT"
            printf '%s\n' 'evidence_class=prospective_ingested' >> "$GITHUB_OUTPUT"
            printf '%s\n' "bundle_directory=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Hash completed subject
        id: hash
        env:
          SUBJECT_PATH: ${{ steps.subject.outputs.subject_path }}
        run: printf '%s\n' "sha256=$(sha256sum "$SUBJECT_PATH" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub artifact attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.subject.outputs.subject_path }}

      - name: Verify GitHub/Sigstore attestation and write receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_PATH: ${{ steps.subject.outputs.subject_path }}
          SUBJECT_SHA256: ${{ steps.hash.outputs.sha256 }}
          BUNDLE_DIGEST: ${{ steps.subject.outputs.bundle_digest }}
          EVIDENCE_CLASS: ${{ steps.subject.outputs.evidence_class }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          gh attestation verify "$SUBJECT_PATH" --repo "$GITHUB_REPOSITORY"
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os
          receipt = {
              "provider": "github_sigstore",
              "status": "verified",
              "subject_path": os.environ["SUBJECT_PATH"],
              "subject_sha256": os.environ["SUBJECT_SHA256"],
              "bundle_digest": os.environ["BUNDLE_DIGEST"],
              "forecast_evidence_class": os.environ["EVIDENCE_CLASS"],
              "attestation_id": os.environ["ATTESTATION_ID"],
              "attestation_url": os.environ["ATTESTATION_URL"],
              "sigstore_bundle_path": os.environ["BUNDLE_PATH"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "attested_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("phase3c-attestation-receipt.json", "w") as stream:
              json.dump(receipt, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY

      - name: Preserve subject and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.subject.outputs.subject_path }}
            ${{ steps.subject.outputs.bundle_directory }}
            ${{ steps.attest.outputs.bundle-path }}
            phase3c-attestation-receipt.json
          if-no-files-found: error
          retention-days: 90

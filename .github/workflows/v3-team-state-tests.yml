name: v3 predictive baseline tests

on:
  push:
    branches: [main]
    paths:
      - "ball_knower_v3/modeling/**"
      - "tests/ball_knower_v3/**"
      - "requirements.txt"
      - ".github/workflows/v3-team-state-tests.yml"
  pull_request:
    paths:
      - "ball_knower_v3/modeling/**"
      - "tests/ball_knower_v3/**"
      - "requirements.txt"
      - ".github/workflows/v3-team-state-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas pytest
      - name: Run v3 predictive baseline tests
        run: python -m pytest -q tests/ball_knower_v3

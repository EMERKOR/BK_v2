name: v3 predictive baseline tests

on:
  push:
    branches: [main]
    paths:
      - "ball_knower_v3/modeling/**"
      - "ball_knower_v3/canonical/**"
      - "ball_knower_v3/evaluation/**"
      - "ball_knower_v3/tests/**"
      - "tests/ball_knower_v3/**"
      - "requirements.txt"
      - ".github/workflows/v3-team-state-tests.yml"
  pull_request:
    paths:
      - "ball_knower_v3/modeling/**"
      - "ball_knower_v3/canonical/**"
      - "ball_knower_v3/evaluation/**"
      - "ball_knower_v3/tests/**"
      - "tests/ball_knower_v3/**"
      - "requirements.txt"
      - ".github/workflows/v3-team-state-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: >-
          python -m pip install --upgrade
          pip==26.2.1
          numpy==2.5.3
          scipy==1.18.1
          pandas==3.0.5
          pytest==9.1.1
      - name: Run v3 predictive baseline tests
        run: python -m pytest -q tests/ball_knower_v3 ball_knower_v3/tests
